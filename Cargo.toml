[package]
name = "stepcam"
version = "0.1.0"
edition = "2021"
description = "stepCAM - G-code generator for helical hole boring and thread milling"

[dependencies]
cavalier_contours = "0.9"
earcutr = "0.5"
eframe = "0.29"
geo = "0.29"
rfd = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
